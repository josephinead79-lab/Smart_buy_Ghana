 <!DOCTYPE html>
 <html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
content="width=device-width,initial-scale=1.0">
<title>SmartBuy Ghana</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
    }


    body {
        background: #ffffff;
        max-width: 480px;
        margin: 0 auto;
    }


    /*Green header */
    .header {
        background: #138a1f;
        color: white;
        padding: 20px 16px 40px 16px;
        border-bottom-left-radius: 30px;
        border-bottom-right-radius: 30px;
    }


    .top-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
    }


    .logo {
        display: flex;
        align-items: center;
        gap: 10px;
    }


    .logo-icon {
        font-size: 40px
    }


    .logo-text {
        font-size: 26px;
        font-weight: bold;
        line-height: 1.1;
    }


    .logo-text .buy {
        color: #ffd800
    }

    .icons {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 16px;
    }

    .icons img {
        width: 28px;
        height: auto;
    }


    /* Search bar */
    .search-bar {
        margin-top: 20px;
        background: white;
        border-radius: 40px;
        padding: 8px 8px 8px 20px;
        display: flex;
        align-items: center;
        justify-content: space-betwwen;
    }


    .search-bar button {
        background: #138a1f;
        color: white;
        border: none;
        border-radius: 50%;
        width: 46px;
        height: 46px;
        font-size: 20px;
        cursor: pointer;
    }
    </style>
  </head>
   <body>


    <div class="header">
        <div class="top-row">
            <div class="logo">
                <span class="logo-icon">
           <span>🛒</span>
                

                
                <div class="logo-text">Smart<span class="buy">Buy</span>
                    <br>Ghana</div>
            </div>
            <div class="icons">
                <span><img src="ghana-flag.webp" alt="Ghana Flag"></span>
                <span>🔔</span>
            </div>
            </div>


            <p class="tagline">Buy smart,Save more.</p>



            <div class="search-bar">
                <input type="text"
        placeholder="Search for a product...">
            <button>🔍</button>
            </div>
            </div>


            </body>
            </html>
