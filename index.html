<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartBuy Ghana</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">

    <header class="header">
      <div class="brand">
        <span class="logo">🛒</span>
        <div class="brand-text">
          <h1>SmartBuy <span>Ghana</span></h1>
          <p>Buy smart. Save more.</p>
        </div>
        <span class="flag" aria-label="Ghana flag"></span>
        <button class="bell" aria-label="Notifications">🔔<span class="badge">2</span></button>
      </div>

      <form class="search" id="search-form">
        <input type="text" id="search-input" placeholder="Search for a product..." />
        <button type="submit" aria-label="Search">🔍</button>
      </form>
    </header>

    <main>
      <section>
        <div class="section-head">
          <h2>Browse Categories</h2>
          <a href="#">See all ›</a>
        </div>
        <div class="categories">
          <!-- Later: replace each emoji with <img src="images/groceries.png" alt="Groceries" /> -->
          <button class="category c-yellow" data-category="groceries"><span>🧺</span>Groceries</button>
          <button class="category c-green" data-category="clothing"><span>👕</span>Clothing</button>
          <button class="category c-pink" data-category="shoes"><span>👟</span>Shoes</button>
          <button class="category c-rose" data-category="beauty"><span>💄</span>Beauty</button>
          <button class="category c-purple" data-category="electronics"><span>📱</span>Electronics</button>
        </div>
      </section>

      <section class="banner">
        <div class="banner-text">
          <h2>Find the Best Prices <strong>in Ghana!</strong></h2>
          <p>Compare • Save • Shop Smart</p>
        </div>
        <!-- Later: add <img src="images/banner-woman.png" alt="" /> here -->
        <div class="banner-image">🛍️</div>
      </section>

      <section>
        <div class="section-head">
          <h2>Popular Searches</h2>
          <a href="#">See all ›</a>
        </div>
        <div class="chips" id="chips">
          <button class="chip">🔍 Rice</button>
          <button class="chip">🔍 Cooking Oil</button>
          <button class="chip">🔍 Sugar</button>
          <button class="chip">🔍 Milk</button>
          <button class="chip">🔍 Tomato Paste</button>
        </div>
      </section>

      <section id="results" class="results" hidden>
        <h2 id="results-title"></h2>
        <ul id="results-list"></ul>
      </section>
    </main>

    <nav class="bottom-nav">
      <a href="#" class="active"><span>🏠</span>Home</a>
      <a href="#"><span>▦</span>Categories</a>
      <a href="#"><span>♡</span>Favourites</a>
      <a href="#"><span>👤</span>Profile</a>
    </nav>

  </div>

  <script src="script.js"></script>
</body>
</html>
